[project]
name = "instagram-mcp"
version = "0.1.0"
description = "MCP server to analyse and publish to an Instagram professional account (Lyric Noir)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
instagram-mcp = "instagram_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["instagram_mcp"]
